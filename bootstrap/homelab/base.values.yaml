projects:
  management:
    name: management

repositories:
  homelabApps:
    create: false
    stringData:
      name: homelab-apps
      url: https://github.com/jkososki/homelab-apps.git
      type: git
  homelabCharts:
    create: false
    stringData:
      name: homelab-charts
      url: https://jkososki.github.io/charts
      type: helm
  argocd:
    create: false
    stringData:
      name: argocd
      url: https://argoproj.github.io/argo-helm
      type: helm

valuesRepo: homelabApps
valuesBranch: main
valuesEnv: ""

applications:
  infra:
    enabled: true
    name: infra
    prefix: ""
    project: management
    valuesRepo: homelabApps
    valuesPath: configs/infra
    chart:
      name: apps-manager
      targetRevision: 0.1.10
      registry: homelabCharts
    destination:
      namespace: argocd
      cluster: local
