master:
  enabled: false
volume:
  enabled: false

allInOne:
  enabled: true
  replicas: 1
  updateStrategy:
    type: Recreate

  data:
    type: persistentVolumeClaim
    size: 100Gi
    storageClass: null
    accessModes: []

  s3:
    enabled: true
    enableAuth: false
    createBuckets:
      - name: loki-chunks
      - name: loki-ruler
      - name: mimir-blocks
      - name: mimir-ruler
      - name: mimir-alert-manager
      - name: tempo-traces

  affinity: ""

s3:
  credentials:
    admin:
      existingSecret: seaweedfs-s3-admin
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: homelab-gateway
        namespace: kube-system
        sectionName: http
    hostnames: ["s3.homelab"]

filer:
  enabled: false
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: homelab-gateway
        namespace: kube-system
        sectionName: http
    hostnames: ["s3files.homelab"]
