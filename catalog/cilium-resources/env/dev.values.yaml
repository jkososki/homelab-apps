manifests:
  ipAddressPool:
    apiVersion: "cilium.io/v2"
    kind: CiliumLoadBalancerIPPool
    metadata:
      name: homelab-ip-pool
    spec:
      blocks:
        - start: 192.168.144.235
          stop: 192.168.144.239
  announcementPolicy:
    apiVersion: "cilium.io/v2alpha1"
    kind: CiliumL2AnnouncementPolicy
    metadata:
      name: l2-announcement
    spec:
      interfaces:
        - eth0
      loadBalancerIPs: true
  gateway:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: homelab-gateway
      namespace: kube-system
    spec:
      gatewayClassName: cilium
      infrastructure:
        annotations:
          lbipam.cilium.io/ips: "192.168.144.235"
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
