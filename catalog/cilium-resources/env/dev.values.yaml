manifests:
  ipAddressPool:
    apiVersion: "cilium.io/v2"
    kind: CiliumLoadBalancerIPPool
    metadata:
      name: address-pool
    spec:
      blocks:
        - start: 192.168.144.235
          stop: 192.168.144.239
  announcementPolicy:
    apiVersion: "cilium.io/v2alpha1"
    kind: CiliumL2AnnouncementPolicy
    metadata:
      name: l2-announcement
    spec:
      interfaces:
        - eth0
      loadBalancerIPs: true
