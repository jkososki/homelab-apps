httproute:
  enabled: true
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
  hostnames:
    - longhorn.homelab
  filters: []
  path: /
  pathType: PathPrefix
  annotations: {}

preUpgradeChecker:
  jobEnabled: false

defaultSettings:
  v1DataEngine: false
  v2DataEngine: true
  createDefaultDiskLabeledNodes: true
  dataEngineCpuMask: '{"v2":"0x1"}'

persistence:
  dataEngine: v2
