projects:
  infrastructure:
    name: infrastructure

repositories:
  homelabApps:
    create: false
    stringData:
      name: homelab-apps
      url: https://github.com/jkososki/homelab-apps.git
      type: git
  homelabCharts:
    create: false
    stringData:
      name: homelab-charts
      url: https://jkososki.github.io/charts
      type: helm
  argocd:
    create: false
    stringData:
      name: argocd
      url: https://argoproj.github.io/argo-helm
      type: helm

valuesRepo: homelabApps
valuesBranch: main
valuesEnv: ""

applications:
  argocd:
    name: argocd
    prefix: ""
    project: infrastructure
    valuesRepo: homelabApps
    valuesPath: catalog/argocd
    chart:
      name: argo-cd
      targetRevision: 10.11.6
      registry: argocd
    destination:
      namespace: argocd
      cluster: local
  gateway_api:
    name: gateway-api
    prefix: ""
    project: infrastructure
    valuesRepo: homelabApps
    valuesPath: catalog/gateway-api
    chart:
      name: gateway-api
      targetRevision: 1.6.3
      registry: homelabCharts
    destination:
      namespace: kube-system
      cluster: local
  cilium:
    name: cilium
    prefix: ""
    project: infrastructure
    valuesRepo: homelabApps
    valuesPath: catalog/cilium
    chart:
      oci: oci://quay.io/cilium/charts/cilium
      targetRevision: 1.20.3
    destination:
      namespace: kube-system
      cluster: local
  cilium_resources:
    name: cilium-resources
    prefix: ""
    project: infrastructure
    valuesRepo: homelabApps
    valuesPath: catalog/cilium-resources
    chart:
      name: raw
      targetRevision: 0.1.1
      registry: homelabCharts
    destination:
      namespace: kube-system
      cluster: local
