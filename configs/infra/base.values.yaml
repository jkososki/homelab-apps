projects:
  infrastructure:
    name: infrastructure

repositories:
  homelabApps:
    name: homelab-apps
    url: https://github.com/jkososki/homelab-apps.git
    type: git
  homelabCharts:
    name: homelab-charts
    url: https://jkososki.github.io/charts
    type: helm
  argocd:
    name: argocd
    url: https://argoproj.github.io/argo-helm
    type: helm

valuesRepo: homelabApps
valuesBranch: main

applications:
  argocd:
    enabled: true
    name: argocd
    prefix: ""
    project: infrastructure
    valuesRepo: homelabApps
    valuesPath: catalog/argocd
    valuesEnv: dev
    chart:
      name: argo-cd
      targetRevision: 10.11.6
      registry: argocd
    destination:
      namespace: argocd
      cluster: local
